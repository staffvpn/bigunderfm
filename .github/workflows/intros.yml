name: Bake voice intros
# Lays the voice intros (intros/voice) over the opening of their tracks and
# commits the results to public/intro, where the site serves them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['intros/**', 'scripts/bake_intros.py', '.github/workflows/intros.yml']
permissions:
  contents: write
concurrency: intros
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Bake
        run: python3 scripts/bake_intros.py
      - name: Commit
        run: |
          git config user.name "bigunderfm-intros"
          git config user.email "intros@users.noreply.github.com"
          git add public/intro
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Bake voice intros"
          git push
