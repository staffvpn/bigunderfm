name: Probe music APIs
on:
  push:
    branches: [main]
    paths: ['probe/request']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query
        run: |
          mkdir -p probe/out
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          out={}
          for g in ['Hip-Hop/Rap','Drum & Bass','Techno','World','Jazz','Lo-Fi','Electronic']:
            for t in ['week','month','year']:
              u='https://api.audius.co/v1/tracks/trending?'+urllib.parse.urlencode({'genre':g,'time':t,'app_name':'BIGUNDERFM'})
              try:
                d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'bigunderfm'}),timeout=40))['data']
              except Exception as e:
                out[g+'|'+t]=str(e);continue
              out[g+'|'+t]=[{'id':x['id'],'a':x['user']['name'],'t':x['title'],'d':x['duration'],'p':x['play_count'],'f':x['favorite_count'],'r':x.get('repost_count'),'sc':bool(x.get('stream_conditions')),'s':x.get('is_streamable'),'tags':x.get('tags'),'mood':x.get('mood'),'art':(x.get('artwork') or {}).get('480x480'),'pw':x.get('parental_warning_type'),'lic':x.get('license')} for x in d]
          json.dump(out,open('probe/out/genres.json','w'),ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "bigunderfm-probe"; git config user.email "probe@users.noreply.github.com"
          git add probe/out; git commit -m "Probe results" || exit 0; git push
