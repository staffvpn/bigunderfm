name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build (unsigned; signed afterwards with the station's key)
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk bigunderfm-unsigned.apk
          gh release create "apk-${{ github.run_number }}" bigunderfm-unsigned.apk --title "Android build ${{ github.run_number }}" --notes "Unsigned build of the Android app." --prerelease
